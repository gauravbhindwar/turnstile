server:
  port: 8787
  forward_proxy_port: 8888
  host: 127.0.0.1
data_dir: ./turnstile-data
admin:
  token: ${TURNSTILE_ADMIN_TOKEN}
upstreams:
  - name: fake
    kind: openai_compat
    base_url: http://localhost:4100/v1
model_routes:
  - { match: "gpt-*", upstream: fake }
policies_dir: ./policies
plugins_dir: ./plugins
approvals:
  default_timeout_s: 120
  max_pending: 50
  public_base_url: http://localhost:8787
  # slack_webhook_url / generic_webhook_url: set these (or export
  # SLACK_WEBHOOK_URL / a generic one via ${VAR}) to see real notifications;
  # the demo works fine without them — decide from the dashboard instead.
