services:
  turnstile:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8787:8787"
      - "8888:8888"
    environment:
      TURNSTILE_ADMIN_TOKEN: ${TURNSTILE_ADMIN_TOKEN:-dev-admin-token-change-me}
      TURNSTILE_CONFIG: /app/config/turnstile.yaml
    volumes:
      - ./turnstile.docker.yaml:/app/config/turnstile.yaml:ro
      - turnstile-data:/app/turnstile-data
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: turnstile
      POSTGRES_PASSWORD: turnstile
      POSTGRES_DB: turnstile
    ports:
      - "5432:5432"
    volumes:
      - turnstile-postgres:/var/lib/postgresql/data

volumes:
  turnstile-data:
  turnstile-postgres:
