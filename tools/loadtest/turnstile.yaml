server:
  port: 8787
  forward_proxy_port: 8888
  host: 127.0.0.1
data_dir: ./turnstile-data
admin:
  token: ${TURNSTILE_ADMIN_TOKEN}
upstreams:
  - name: fake
    kind: openai_compat
    base_url: http://localhost:4100/v1
model_routes:
  - { match: "gpt-*", upstream: fake }
policies_dir: ./policies
plugins_dir: ./plugins
logging:
  level: warn
